name: fndtv
description: "A new Flutter project."
publish_to: "none"
version: 0.0.11+12

environment:
  sdk: ">=3.2.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  commons:
    path: packages/commons

  ui_kit:
    path: packages/ui_kit

  app_logger:
    path: packages/app_logger

  app_localization:
    path: packages/app_localization

  app_focus:
    path: packages/app_focus

  local_storage:
    path: packages/local_storage
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.7
  flutter_bloc: ^9.1.1
  transparent_image: ^2.0.1
  cached_network_image: ^3.2.3
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  intl: ^0.20.2
  flutter_cache_manager: ^3.3.1
  device_info_plus: ^11.0.0
  package_info_plus: ^8.0.2
  wakelock_plus: ^1.3.3
  bloc_concurrency: ^0.3.0
  stream_transform: ^2.1.0
  http: ^1.1.0
  connectivity_plus: ^6.1.0
  dio: ^5.4.0
  path_provider: ^2.1.0
  crypto: ^3.0.3
  image_picker: ^1.0.7
  ensure_visible_when_focused: ^1.1.1
  shimmer: ^3.0.0
  qr_flutter: ^4.1.0
  equatable: ^2.0.5
  # Direct dep for the STB diag reader's hand-rolled libmpv FFI (Utf8 helpers).
  ffi: ^2.1.0
  url_launcher: ^6.3.1
  flutter_animate: ^4.5.2
  flutter_launcher_icons: ^0.14.3
  video_player: ^2.9.5
  chewie: ^1.8.5
  # STB (RK3328) plays through mpv (media_kit) instead of ExoPlayer/Media3,
  # whose MediaCodec path fails on Rockchip even though the HW decoder works.
  # Gated to the stb flavor (see StbVideoPlayer / VideoPlayerPage).
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  google_fonts: ^6.2.1
  country_flags: ^3.1.0
  just_audio: ^0.9.42
  just_audio_background: ^0.0.1-beta.15

flutter_launcher_icons:
  android: true
  ios: true
  # Sources live in assets/launcher/, NOT assets/img/. pubspec globs
  # `assets/img/` into the bundle, so keeping 1024x1024 icon sources there
  # shipped 1.35 MB of PNGs the app never reads at runtime — they are only
  # inputs to `dart run flutter_launcher_icons`.
  image_path: "assets/launcher/app_icon.png"
  remove_alpha_ios: true
  background_color: "#000000"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/launcher/app_icon_foreground.png"

dev_dependencies:
  flutter_test:
    sdk: flutter
  json_serializable: ^6.7.1
  build_runner: ^2.4.6
  freezed: ^2.4.1
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/svg/
    - assets/img/
    - assets/video/
  fonts:
    - family: Urbanist
      fonts:
        - asset: assets/fonts/Urbanist-Bold.ttf
          weight: 700
        - asset: assets/fonts/Urbanist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Urbanist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Urbanist-SemiBold.ttf
          weight: 600
